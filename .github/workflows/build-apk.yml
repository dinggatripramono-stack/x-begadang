name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/X-BEGADANG-v1.0.apk
          ls -la release-apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-BEGADANG-APK
          path: release-apk/X-BEGADANG-v1.0.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "X-BEGADANG v1.0.0 (Official Standalone Android APK)"
          body: |
            ## 📱 X-BEGADANG — Neuro-Sleep Architecture & Sunnah Wake Engine
            **Versi:** 1.0.0 Standalone Android Native APK
            
            ### Cara Pasang di HP Android:
            1. Download file `X-BEGADANG-v1.0.apk` di bawah ini langsung dari HP Anda.
            2. Buka file yang selesai didownload, ketuk **Install**.
            3. Aplikasi langsung terpasang mandiri di HP tanpa butuh PC dan tanpa langganan!
          files: release-apk/X-BEGADANG-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
